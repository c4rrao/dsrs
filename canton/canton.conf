// Storage is PostgreSQL rather than H2 because H2 caps a serialized transaction at 1 MiB, and
// DistributePerTransaction pays every matched transaction in one Daml transaction. Under H2 the
// domain died at around 250 matched transactions.

canton {
  features {
    enable-preview-commands = yes
    enable-testing-commands = yes
  }

  parameters {
    non-standard-config = yes
  }

  domains {
    mydomain {
      storage {
        type = postgres
        config {
          dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
          properties = {
            serverName = "canton-domain-db"
            portNumber = "5432"
            databaseName = "canton_domain"
            user = "canton"
            password = "canton"
          }
        }
        parameters {
          max-connections = 8
        }
      }

      init {
        domain-parameters {
          unique-contract-keys = true
        }
      }

      public-api {
        port = 4001
        address = "0.0.0.0"
      }

      admin-api {
        port = 4002
        address = "0.0.0.0"
      }
    }
  }

  participants {
    // every party is hosted on this one node
    participant {
      storage {
        type = postgres
        config {
          dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
          properties = {
            serverName = "canton-participant-db"
            portNumber = "5432"
            databaseName = "canton_participant"
            user = "canton"
            password = "canton"
          }
        }
        parameters {
          max-connections = 8
        }
      }

      ledger-api {
        port = 6865
        address = "0.0.0.0"
        // must stay >= the domain's max request size set in bootstrap.canton
        max-inbound-message-size = 33554432
      }

      admin-api {
        port = 6866
        address = "0.0.0.0"
      }

      init {
        ledger-api {
          max-deduplication-duration = 30 minutes
        }
      }
    }
  }
}
